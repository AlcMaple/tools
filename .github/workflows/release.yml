name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bgm-offline-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build offline index seed
        run: node scripts/build-bgm-offline-index.mjs --out-dir dist/bgm-offline-index

      - name: Upload offline index seed
        uses: actions/upload-artifact@v4
        with:
          name: bgm-offline-index-seed
          path: |
            dist/bgm-offline-index/bgm-offline-index-v1.json.gz
            dist/bgm-offline-index/bgm-offline-index-manifest.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: bgm-offline-index
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-14
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clear .npmrc for CI
        shell: bash
        run: echo "" > .npmrc

      - name: Download offline index seed
        uses: actions/download-artifact@v4
        with:
          name: bgm-offline-index-seed
          path: resources/bgm-offline-index

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest.yml
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected files
        run: ls -lhR artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest.yml
            artifacts/**/latest-mac.yml
            artifacts/**/*.blockmap

      - name: Verify release assets
        # 之前踩过：这一步的上传其实全部成功，但 action 自身在收尾时报了 failure，
        # 红叉具有误导性。用 always() 跳过它的报告结果，直接查 GitHub 上真实存在
        # 的产物数量来判断这次发布到底完不完整。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets="$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          echo "== release assets for $tag =="
          echo "$assets"

          for required in latest.yml latest-mac.yml; do
            echo "$assets" | grep -qx "$required" || { echo "缺少 $required"; exit 1; }
          done

          for ext in exe dmg zip; do
            echo "$assets" | grep -q "\.${ext}$" || { echo "缺少 *.${ext}"; exit 1; }
          done

          for ext in exe.blockmap dmg.blockmap zip.blockmap; do
            echo "$assets" | grep -q "\.${ext}$" || { echo "缺少 *.${ext}"; exit 1; }
          done

          count="$(echo "$assets" | grep -c .)"
          echo "产物总数: $count"
          if [ "$count" -lt 8 ]; then
            echo "预期至少 8 个产物（exe/dmg/zip 各一 + 各自 blockmap + latest.yml + latest-mac.yml），实际 $count"
            exit 1
          fi

          echo "产物齐全"
