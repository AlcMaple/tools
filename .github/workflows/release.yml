name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bgm-offline-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build offline index seed
        run: node scripts/build-bgm-offline-index.mjs --out-dir dist/bgm-offline-index

      - name: Upload offline index seed
        uses: actions/upload-artifact@v4
        with:
          name: bgm-offline-index-seed
          path: |
            dist/bgm-offline-index/bgm-offline-index-v1.json.gz
            dist/bgm-offline-index/bgm-offline-index-manifest.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: bgm-offline-index
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-14
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clear .npmrc for CI
        shell: bash
        run: echo "" > .npmrc

      - name: Download offline index seed
        uses: actions/download-artifact@v4
        with:
          name: bgm-offline-index-seed
          path: resources/bgm-offline-index

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected files
        run: ls -lhR artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.yml
            artifacts/**/*.blockmap
