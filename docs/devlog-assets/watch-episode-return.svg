<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710"><rect x="1" y="1" width="1078" height="708" rx="14" fill="#fbfafb" stroke="#e2dcdf" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="28" y="38" fill="#282529">继续看：接到刚才那一集，手帐数字仍由你定</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" x="28" y="65" fill="#756f73">本地样本：手帐第 1 集，播放器已看第 2 集；返回后直接接到第 2 集，不再重新找</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="28" y="105" fill="#282529">原来：播放器知道单集位置，但返回入口仍按旧集数打开</text><rect x="28" y="122" width="320" height="80" rx="10" fill="#fdeef0" stroke="#d99aa5" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="46" y="151" fill="#96434f">手帐第 1 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="46" y="179" fill="#282529">记录没有被自动改动</text><rect x="380" y="122" width="320" height="80" rx="10" fill="#fdeef0" stroke="#d99aa5" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="398" y="151" fill="#96434f">已播放第 2 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="398" y="179" fill="#282529">离开时停在这集的中途</text><rect x="732" y="122" width="320" height="80" rx="10" fill="#fdeef0" stroke="#d99aa5" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="750" y="151" fill="#96434f">继续看又打开第 1 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="750" y="179" fill="#282529">需要再次寻找第 2 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="356" y="167" fill="#282529">→</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="708" y="167" fill="#282529">→</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="28" y="242" fill="#282529">现在：只记实际开始观看的集数，不自动记成看完</text><rect x="28" y="260" width="320" height="103" rx="10" fill="#edf7f1" stroke="#7fad91" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="46" y="287" fill="#316247">真实开始第 2 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="46" y="316" fill="#282529">只打开页面、只点选集都不记</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="46" y="342" fill="#282529">保持首次暂停，仍由用户点播放</text><rect x="380" y="260" width="320" height="103" rx="10" fill="#edf7f1" stroke="#7fad91" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="398" y="287" fill="#316247">本机记住最近观看集数</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="398" y="316" fill="#282529">不新建另一份单集秒级记录</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="398" y="342" fill="#282529">原播放器继续负责时间点提示</text><rect x="732" y="260" width="320" height="103" rx="10" fill="#edf7f1" stroke="#7fad91" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="750" y="287" fill="#316247">返回后继续第 2 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="750" y="316" fill="#282529">手帐数字仍然是第 1 集</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="750" y="342" fill="#282529">不自动加入追番或开播</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="356" y="310" fill="#282529">→</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="708" y="310" fill="#282529">→</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="28" y="405" fill="#282529">边界：让用户的新选择优先，不把旧记录带错地方</text><rect x="28" y="422" width="241" height="106" rx="10" fill="#eef4f8" stroke="#91adc1" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="44" y="450" fill="#36566d">换账号</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="44" y="480" fill="#282529">集数和单集位置各自隔离</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="44" y="506" fill="#282529">不读上一账号的播放位置</text><rect x="289" y="422" width="241" height="106" rx="10" fill="#eef4f8" stroke="#91adc1" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="305" y="450" fill="#36566d">修改手帐</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="305" y="480" fill="#282529">按用户的新记录继续</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="305" y="506" fill="#282529">旧续看不盖过新编辑</text><rect x="550" y="422" width="241" height="106" rx="10" fill="#eef4f8" stroke="#91adc1" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="566" y="450" fill="#36566d">未起播或过期</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="566" y="480" fill="#282529">未开始的集数不覆盖历史</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="566" y="506" fill="#282529">旧记录失效后按手帐打开</text><rect x="811" y="422" width="241" height="106" rx="10" fill="#eef4f8" stroke="#91adc1" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="827" y="450" fill="#36566d">存储不可用</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="827" y="480" fill="#282529">播放不被本机记忆阻断</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="827" y="506" fill="#282529">仍能按原手帐手动选择</text><rect x="28" y="553" width="1024" height="90" rx="10" fill="#fff8e8" stroke="#d9bd85" /><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" x="46" y="580" fill="#7a6234">为什么不直接接管旧的秒级提示？</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="46" y="606" fill="#282529">旧记录没有账号归属，新版不猜它属于谁；本次不自动迁移或主动删除，回滚后仍可按旧方式读取</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="46" y="628" fill="#282529">本机记忆有保留上限，不作为已看证明，也不替代手动追番记录</text><text font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" x="28" y="684" fill="#756f73">仅记录本站能确认起播的播放器，跳源站或跨域画面不猜进度；生成片验证不代表真实动漫线路已验收</text></svg>
