<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="748" viewBox="0 0 1080 748"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#756f73"/></marker></defs><rect x="1" y="1" width="1078" height="746" rx="14" fill="#fbfafb" stroke="#e2dcdf"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="26" y="34" font-size="19" font-weight="700" fill="#282529">找到番以后，下一步就在卡片上</text><text x="26" y="59" font-size="12.5" font-weight="400" fill="#756f73">先说清需要登录，登录返回仍接着刚才选的番，不自动加追番或开播</text><text x="26" y="99" font-size="14" font-weight="700" fill="#282529">之前：搜索成功，却还需要猜入口</text><rect x="26" y="115" width="239" height="87" rx="9" fill="#fdeef0" stroke="#d99aa5"/><text x="40" y="139" font-size="12.5" font-weight="700" fill="#96434f">搜到原作</text><text x="40" y="162" font-size="11" font-weight="400" fill="#96434f">番名、年份和集数都在</text><path d="M267 159h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="289" y="115" width="239" height="87" rx="9" fill="#fdeef0" stroke="#d99aa5"/><text x="303" y="139" font-size="12.5" font-weight="700" fill="#96434f">点番名或封面</text><text x="303" y="162" font-size="11" font-weight="400" fill="#96434f">没有观看动作或说明</text><path d="M530 159h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="552" y="115" width="239" height="87" rx="9" fill="#fdeef0" stroke="#d99aa5"/><text x="566" y="139" font-size="12.5" font-weight="700" fill="#96434f">转去放映室</text><text x="566" y="162" font-size="11" font-weight="400" fill="#96434f">看到的是线路统计</text><path d="M793 159h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="815" y="115" width="239" height="87" rx="9" fill="#fdeef0" stroke="#d99aa5"/><text x="829" y="139" font-size="12.5" font-weight="700" fill="#96434f">再点找番</text><text x="829" y="162" font-size="11" font-weight="400" fill="#96434f">这时才遇到登录要求</text><text x="26" y="240" font-size="14" font-weight="700" fill="#282529">现在：一步步接到原有观看流程</text><rect x="26" y="256" width="186" height="87" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="40" y="280" font-size="12.5" font-weight="700" fill="#316247">搜到原作</text><text x="40" y="303" font-size="11" font-weight="400" fill="#316247">目录与周历都可用</text><path d="M214 300h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="236" y="256" width="186" height="87" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="250" y="280" font-size="12.5" font-weight="700" fill="#316247">登录后观看</text><text x="250" y="303" font-size="11" font-weight="400" fill="#316247">动作就在对应卡片上</text><path d="M424 300h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="446" y="256" width="186" height="87" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="460" y="280" font-size="12.5" font-weight="700" fill="#316247">登录返回</text><text x="460" y="303" font-size="11" font-weight="400" fill="#316247">仍是刚才选的番</text><path d="M634 300h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="656" y="256" width="186" height="87" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="670" y="280" font-size="12.5" font-weight="700" fill="#316247">继续选择播放源</text><text x="670" y="303" font-size="11" font-weight="400" fill="#316247">已有进度沿用原记录</text><path d="M844 300h17" stroke="#756f73" fill="none" marker-end="url(#arrow)"/><rect x="866" y="256" width="186" height="87" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="880" y="280" font-size="12.5" font-weight="700" fill="#316247">播放器等你点播放</text><text x="880" y="303" font-size="11" font-weight="400" fill="#316247">保留明确用户手势</text><text x="26" y="383" font-size="14" font-weight="700" fill="#282529">为什么不是点一下就直接开播？</text><rect x="26" y="399" width="326" height="110" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="40" y="423" font-size="12.5" font-weight="700" fill="#36566d">登录与观看分开</text><text x="40" y="446" font-size="11" font-weight="400" fill="#36566d">登录权限没有变化</text><text x="40" y="465" font-size="11" font-weight="400" fill="#36566d">先选片源，视频仍等用户点播放</text><text x="40" y="484" font-size="11" font-weight="400" fill="#36566d">试看不等于自动加入追番</text><rect x="377" y="399" width="326" height="110" rx="9" fill="#eef4f8" stroke="#91adc1"/><text x="391" y="423" font-size="12.5" font-weight="700" fill="#36566d">登录返回不是重新找番</text><text x="391" y="446" font-size="11" font-weight="400" fill="#36566d">只短时记住公开番剧条目</text><text x="391" y="465" font-size="11" font-weight="400" fill="#36566d">整页跳转后继续原来的选择</text><text x="391" y="484" font-size="11" font-weight="400" fill="#36566d">已有追番进度不退回第一集</text><rect x="728" y="399" width="326" height="110" rx="9" fill="#f4f2f5" stroke="#c3bcc6"/><text x="742" y="423" font-size="12.5" font-weight="700" fill="#4a4450">用户随时能取消</text><text x="742" y="446" font-size="11" font-weight="400" fill="#4a4450">关闭登录就清除这次观看意图</text><text x="742" y="465" font-size="11" font-weight="400" fill="#4a4450">离开页面不会在稍后突然重放</text><text x="742" y="484" font-size="11" font-weight="400" fill="#4a4450">过期或损坏的记录不恢复</text><rect x="26" y="539" width="500" height="129" rx="9" fill="#edf7f1" stroke="#7fad91"/><text x="40" y="563" font-size="12.5" font-weight="700" fill="#316247">已实际验证</text><text x="40" y="586" font-size="11" font-weight="400" fill="#316247">本地生成片：画面与进度从 0 推进到约 113 秒</text><text x="40" y="605" font-size="11" font-weight="400" fill="#316247">真实控件拖进度、暂停续播和切到第 2 集</text><text x="40" y="624" font-size="11" font-weight="400" fill="#316247">长期角色仍接原第 11 集，记录没有被加一</text><rect x="552" y="539" width="502" height="129" rx="9" fill="#fff8e8" stroke="#d9bd85"/><text x="566" y="563" font-size="12.5" font-weight="700" fill="#7a6234">仍需真实场景补齐</text><text x="566" y="586" font-size="11" font-weight="400" fill="#7a6234">本地测试片不是线上动漫片源验收</text><text x="566" y="605" font-size="11" font-weight="400" fill="#7a6234">线上登录后的线路、波动和一集持续稳定性未验</text><text x="566" y="624" font-size="11" font-weight="400" fill="#7a6234">声音、手机真机、断网与重缓冲恢复仍有缺口</text><text x="26" y="711" font-size="12" font-weight="400" fill="#756f73">常见情况：已登录用户仍按原来的「试看 / 继续看」进入，不增加确认步骤</text></g></svg>