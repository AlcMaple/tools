<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="1118" height="638" rx="14" fill="#fbf6ec" stroke="#d8cfbf"/>
<text x="32" y="42" font-size="25" font-weight="700" fill="#343b42">先选合适篇幅，再决定看哪部</text>
<text x="32" y="76" font-size="16" fill="#52646a">在原目录组合「13 集以内」「已播完」与题材，未知不冒充已完成</text>
<rect x="32" y="108" width="326" height="190" rx="12" fill="#ffffff" stroke="#d8cfbf"/>
<text x="52" y="143" font-size="19" font-weight="600">原来要逐张判断</text>
<text x="52" y="180" font-size="16">题材筛过，长篇和短篇仍混在一起</text>
<text x="52" y="214" font-size="16">有集数，也未必已经播完</text>
<text x="52" y="259" font-size="14" fill="#756f73">首播年份不代表结束时间</text>
<text x="377" y="210" font-size="29" fill="#60958f">→</text>
<rect x="422" y="108" width="326" height="190" rx="12" fill="#eaf2ed" stroke="#60958f"/>
<text x="442" y="143" font-size="19" font-weight="600">现在组合选择</text>
<text x="442" y="180" font-size="16">13 集以内 ＋ 已播完 ＋ 治愈</text>
<text x="442" y="214" font-size="16">只留下同时符合的候选</text>
<text x="442" y="259" font-size="14" fill="#52646a">返回保留条件，清空恢复原列表</text>
<text x="765" y="210" font-size="29" fill="#60958f">→</text>
<rect x="808" y="108" width="280" height="190" rx="12" fill="#ffffff" stroke="#d8cfbf"/>
<text x="828" y="143" font-size="19" font-weight="600">继续原来的路径</text>
<text x="828" y="180" font-size="16">读卡片，选择想看的番</text>
<text x="828" y="214" font-size="16">使用既有观看入口</text>
<text x="828" y="259" font-size="14" fill="#756f73">不新增推荐首页或登录捷径</text>
<rect x="32" y="328" width="1056" height="170" rx="12" fill="#fff" stroke="#d8cfbf"/>
<text x="52" y="362" font-size="19" font-weight="600">为什么不按集数或年份猜「已播完」？</text>
<text x="52" y="399" font-size="16">只有条目明确写出的结束日期已过去，才列入「已播完」；当天结束也先不算</text>
<text x="52" y="434" font-size="16">未来、仅年月、日期冲突、缺失 → 不进入已播完集合；未知集数 → 不进入篇幅范围</text>
<text x="52" y="469" font-size="16">判断针对这一条作品，不代表整个系列结束；不把集数换算成虚构的观看小时数</text>
<text x="32" y="542" font-size="18" font-weight="600">数据还没准备好怎么办？</text>
<text x="32" y="577" font-size="16">旧目录仍照常可用，新增条件暂不显示；新数据就绪后自动出现，不改追番记录</text>
<text x="32" y="612" font-size="14" fill="#756f73">常见情况：不选新条件，浏览方式和排序不变；数据来自已有离线归档，不逐条在线查询</text>
</svg>
