<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">网页版邮箱仅验证码注册登录流程</title>
  <desc id="desc">邮箱验证码验证后，已有账号直接登录，新邮箱自动创建无密码账号；两条路径最终签发同一安全会话。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151313"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3b8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffb3b8" stop-opacity=".06"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#aa9092"/>
    </marker>
    <style>
      .box{fill:#1b1a1a;stroke:#574548;stroke-width:1}.hot{fill:url(#focus);stroke:#ffb3b8;stroke-width:1.2}
      .title{fill:#eee5e6;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
      .body{fill:#d7c5c7;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
      .muted{fill:#a68f91;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
      .label{fill:#ffb3b8;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:1px}
      .line{fill:none;stroke:#aa9092;stroke-width:1.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="430" rx="18" fill="url(#bg)"/>
  <text x="36" y="40" class="label">WEB AUTH · EMAIL OTP</text>
  <text x="36" y="66" class="title">验证码同时完成邮箱所有权确认与登录，不再创建邮箱密码</text>

  <rect x="36" y="104" width="174" height="88" rx="12" class="box"/>
  <text x="54" y="132" class="title">输入邮箱</text>
  <text x="54" y="156" class="body">POST /email/start</text>
  <text x="54" y="177" class="muted">新旧邮箱响应一致</text>

  <path d="M210 148H263" class="line"/>
  <rect x="265" y="104" width="214" height="88" rx="12" class="hot"/>
  <text x="283" y="132" class="title">短期验证码挑战</text>
  <text x="283" y="156" class="body">HMAC(code) · 10 分钟 · 最多 5 错</text>
  <text x="283" y="177" class="muted">重发使旧挑战失效 · IP / 邮箱限流</text>

  <path d="M479 148H532" class="line"/>
  <rect x="534" y="104" width="190" height="88" rx="12" class="box"/>
  <text x="552" y="132" class="title">验证 6 位码</text>
  <text x="552" y="156" class="body">POST /email/verify</text>
  <text x="552" y="177" class="muted">成功后只消费一次</text>

  <path d="M724 136H772V112H795" class="line"/>
  <path d="M724 160H772V237H795" class="line"/>

  <rect x="797" y="82" width="127" height="82" rx="12" class="box"/>
  <text x="815" y="110" class="title">已有邮箱</text>
  <text x="815" y="134" class="body">读取原账号</text>
  <text x="815" y="151" class="muted">不改旧密码能力</text>

  <rect x="797" y="207" width="127" height="94" rx="12" class="hot"/>
  <text x="815" y="235" class="title">新邮箱</text>
  <text x="815" y="259" class="body">自动生成用户名</text>
  <text x="815" y="278" class="muted">password_enabled = 0</text>

  <path d="M860 164V337H681" class="line"/>
  <path d="M860 301V337H681" class="line"/>
  <rect x="446" y="305" width="233" height="78" rx="12" class="hot"/>
  <text x="464" y="333" class="title">签发同一安全会话</text>
  <text x="464" y="357" class="body">HttpOnly · SameSite=Strict · 最长 30 天</text>
  <text x="464" y="375" class="muted">退出 / 换设备 / 失效后重新收码</text>

  <rect x="36" y="244" width="318" height="100" rx="12" class="box"/>
  <text x="54" y="272" class="title">传统用户名 / 密码账号</text>
  <text x="54" y="296" class="body">旧数据默认 password_enabled = 1</text>
  <text x="54" y="318" class="muted">登录、修改密码、密保找回继续兼容</text>
  <path d="M354 294H420V337H446" class="line"/>

  <text x="480" y="412" text-anchor="middle" class="muted">浏览器自动填充与设备指纹只提供输入便利，不能替代邮箱验证或第三方签名身份</text>
</svg>
