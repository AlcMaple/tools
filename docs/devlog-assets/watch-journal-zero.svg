<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410">
<rect x="1" y="1" width="858" height="408" rx="14" fill="#fbfafb" stroke="#e2dcdf"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#282529">
<text x="26" y="37" font-size="19" font-weight="700">还没开看，就是 0 集；开始观看仍从第 1 话</text>
<text x="26" y="63" font-size="12.5" fill="#756f73">手帐显示和播放入口分开取值，不让切换列表看起来多看了一集</text>
<rect x="26" y="89" width="808" height="44" rx="9" fill="#eef4f8" stroke="#91adc1"/>
<text x="44" y="117" font-size="12.5" font-weight="700">组件回归样本：同一条想看记录，手帐始终是 0 / 12，未修改任何用户数据</text>
<text x="44" y="168" font-size="14" font-weight="700">位置</text>
<text x="285" y="168" font-size="14" font-weight="700" fill="#96434f">之前</text>
<text x="555" y="168" font-size="14" font-weight="700" fill="#316247">现在</text>
<path d="M26 183h808M26 228h808M26 273h808" stroke="#e2dcdf"/>
<text x="44" y="212" font-size="12.5">卡片中的手帐进度</text><text x="285" y="212" font-size="12.5">0 / 12</text><text x="555" y="212" font-size="12.5">0 / 12，不变</text>
<text x="44" y="257" font-size="12.5">切换成列表</text><text x="285" y="257" font-size="12.5" fill="#96434f">EP 1 / 12，与卡片不同</text><text x="555" y="257" font-size="12.5" fill="#316247">EP 0 / 12，与卡片一致</text>
<text x="44" y="302" font-size="12.5">点击继续看</text><text x="285" y="302" font-size="12.5">选择第 1 话的播放源</text><text x="555" y="302" font-size="12.5">仍选择第 1 话，不存在第 0 话</text>
<rect x="26" y="330" width="808" height="56" rx="9" fill="#edf7f1" stroke="#7fad91"/>
<text x="44" y="353" font-size="11" fill="#316247">已有进度保持原样：隔离界面中第 5 集仍显示 5 / 28，观看入口仍是第 5 话</text>
<text x="44" y="375" font-size="11" fill="#316247">未知总集数、手动条目也显示真实手帐数；观望原提示不变，不自动记进度</text>
</g></svg>
