<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 940" width="1120" height="940" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="1120" height="940" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="17" font-weight="700" fill="#111">点「在线观看」→ 稀饭源：代码实际怎么走</text>
  <text x="20" y="52" font-size="12" fill="#666">Windows 与 macOS 走的是同一条路径 —— 全链路没有任何 process.platform 分支</text>

  <!-- entry decision -->
  <rect x="360" y="72" width="400" height="42" rx="21" fill="#eef2f7" stroke="#c3cede"/>
  <text x="560" y="98" font-size="13" font-weight="700" fill="#111" text-anchor="middle">追番卡片「播放」→ /play</text>

  <path d="M560 114 L560 140" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="380" y="142" width="360" height="46" fill="#fff6e0" stroke="#e3cf9a"/>
  <text x="560" y="163" font-size="12.5" font-weight="700" fill="#111" text-anchor="middle">这部番绑过稀饭吗？</text>
  <text x="560" y="180" font-size="11" fill="#777" text-anchor="middle">entry.builtin &amp;&amp; !entry.binding → 才需要搜索</text>

  <path d="M380 165 L250 165 L250 210" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="300" y="158" font-size="11" fill="#a12c2c">没绑定</text>
  <path d="M740 165 L900 165 L900 210" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="795" y="158" font-size="11" fill="#2b7a4b">已绑定 → 跳过搜索</text>

  <!-- LEFT: search branch -->
  <rect x="40" y="212" width="420" height="250" fill="#fdf6f6" stroke="#ecd4d4"/>
  <text x="56" y="234" font-size="12.5" font-weight="700" fill="#a12c2c">A · 站内搜索（只在没绑定时发生）</text>

  <rect x="56" y="246" width="388" height="44" fill="#fff" stroke="#e0cccc"/>
  <text x="68" y="264" font-size="11.5" fill="#111">A1 新建隐藏窗口 → 加载 search.html?wd=…</text>
  <text x="68" y="280" font-size="10.5" fill="#777">建窗即 setAudioMuted；等 dom-ready 而非 did-finish-load</text>

  <rect x="56" y="298" width="388" height="60" fill="#fff" stroke="#e0cccc"/>
  <text x="68" y="316" font-size="11.5" fill="#111">A2 站点要验证码 → search() 返回 needs_captcha</text>
  <text x="68" y="332" font-size="10.5" fill="#777">渲染层弹**应用内**验证码界面，不打开网站窗口</text>
  <text x="68" y="348" font-size="10.5" fill="#777">图片与提交走 requestXifanBrowser：复用同一张页的 JS 上下文</text>

  <rect x="56" y="366" width="388" height="44" fill="#fff" stroke="#e0cccc"/>
  <text x="68" y="384" font-size="11.5" fill="#111">A3 用户挑中候选 → 自动写回 binding</text>
  <text x="68" y="400" font-size="10.5" fill="#777">下次进来就走右边那条，不再搜</text>

  <rect x="56" y="418" width="388" height="32" fill="#f0f0f0" stroke="#d8d8d8"/>
  <text x="68" y="438" font-size="10.5" fill="#666">验证码/登录期间窗口续期 10 分钟 —— 覆盖的是人看图输入的时间，不是请求耗时</text>

  <!-- RIGHT: cache decision -->
  <rect x="660" y="212" width="420" height="250" fill="#f4faf6" stroke="#cde5d5"/>
  <text x="676" y="234" font-size="12.5" font-weight="700" fill="#2b7a4b">B · 取集数与线路（watch 信息）</text>

  <rect x="676" y="246" width="388" height="56" fill="#fff" stroke="#cde2d4"/>
  <text x="688" y="264" font-size="11.5" fill="#111">B1 追番记录填了总集数吗？（preferCache）</text>
  <text x="688" y="280" font-size="10.5" fill="#777">填了 → 查 7 天 watch 缓存　没填 → 直接重新请求这张 watch 页取集数列表</text>
  <text x="688" y="295" font-size="10.5" fill="#777">URL 不变但集数会涨，吃缓存就看不到新集；这条路不经过搜索，不会触发验证码</text>

  <rect x="676" y="310" width="182" height="52" fill="#eaf7ee" stroke="#bfe0ca"/>
  <text x="688" y="330" font-size="11.5" fill="#111">B2 命中缓存</text>
  <text x="688" y="347" font-size="10.5" fill="#777">零请求，窗口都不建</text>

  <rect x="882" y="310" width="182" height="52" fill="#fff" stroke="#cde2d4"/>
  <text x="894" y="330" font-size="11.5" fill="#111">B3 未命中</text>
  <text x="894" y="347" font-size="10.5" fill="#777">隐藏窗口读 watch 页</text>

  <rect x="676" y="372" width="388" height="76" fill="#fff" stroke="#cde2d4"/>
  <text x="688" y="390" font-size="11.5" fill="#111">B4 解析出：总集数 · 线路列表 · 地址模板 epPage</text>
  <text x="688" y="407" font-size="10.5" fill="#777">读完 HTML → stopPageMedia（停掉页内站点播放器）</text>
  <text x="688" y="423" font-size="10.5" fill="#777">→ 队列跑空即 destroy 窗口，不再常驻</text>
  <text x="688" y="439" font-size="10.5" fill="#777">结果写回 xifan-watch-cache.json（7 天）</text>

  <path d="M250 462 L250 490 L560 490" stroke="#8a8a8a" stroke-width="1.4"/>
  <path d="M900 462 L900 490 L560 490" stroke="#8a8a8a" stroke-width="1.4"/>
  <path d="M560 490 L560 516" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- C: resolve ep url -->
  <rect x="180" y="518" width="760" height="128" fill="#f7f9fc" stroke="#ccd6e4"/>
  <text x="196" y="540" font-size="12.5" font-weight="700" fill="#1a4f9c">C · 解析这一集的 mp4 地址</text>
  <text x="196" y="562" font-size="11.5" fill="#111">C1 先查 24h 地址缓存 xifan-url-cache.json（按播放页 URL）</text>
  <text x="196" y="582" font-size="11.5" fill="#111">C2 未命中 → 用模板推算：epPage.replace('{ep}', N)　<tspan fill="#2b7a4b">零请求</tspan></text>
  <text x="196" y="602" font-size="11.5" fill="#111">C3 模板算出的地址播不了（特殊集/过期）→ 才回源读一次该集播放页</text>
  <text x="196" y="624" font-size="10.5" fill="#777">同一集的并发解析合并为一次；仍失败才自动换下一条线路，三条都完才报错</text>

  <path d="M560 646 L560 672" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- D: playback -->
  <rect x="180" y="674" width="760" height="112" fill="#eaf7ee" stroke="#bfe0ca"/>
  <text x="196" y="696" font-size="12.5" font-weight="700" fill="#2b7a4b">D · 交给播放器（渲染进程）</text>
  <text x="196" y="718" font-size="11.5" fill="#111">D1 地址包成同源 mtmedia:// 喂 &lt;video&gt;（直链跨源会被 Chromium 拦）</text>
  <text x="196" y="738" font-size="11.5" fill="#111">D2 主进程 media-cache 边下边播：512KiB 分块、滑动窗口预抓</text>
  <text x="196" y="758" font-size="11.5" fill="#111">D3 离开播放页：detachVideo 收干净 + media:release 删临时文件</text>
  <text x="196" y="776" font-size="10.5" fill="#777">暂停时**继续**缓冲（readers &gt; 0 拦住 idle 看门狗）—— 这是刻意设计，别改掉</text>

  <!-- footer: platform note -->
  <rect x="40" y="806" width="1040" height="112" fill="#f2f2f2" stroke="#d5d5d5"/>
  <text x="56" y="828" font-size="12.5" font-weight="700" fill="#111">关于「Windows 和 mac 有什么不同」</text>
  <text x="56" y="850" font-size="11.5" fill="#555">上面每一步在两个平台都完全相同。播放器、media-proxy、media-cache、browser-challenge 里都没有 process.platform 分支。</text>
  <text x="56" y="870" font-size="11.5" fill="#555">已知的两处平台可观察差异，都不是路径不同：</text>
  <text x="70" y="890" font-size="11.5" fill="#555">· A1/B3 那个隐藏窗口在后台播站点播放器 —— 只在 Windows 被听到（原因未知，已用静音+停播+销毁窗口从根上消除）</text>
  <text x="70" y="908" font-size="11.5" fill="#555">· 临时文件删除：Windows 句柄未关时 rmSync 必失败，mac 允许 unlink 打开中的文件（已改为后台重试删除）</text>
</svg>
