<!DOCTYPE html>
<html lang="zh-CN" data-mist="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · MapleTools「雾境梦璃」设计稿</title>
<script>/* 防闪白：渲染前恢复主题 */try{const t=localStorage.getItem('mist-theme');if(t)document.documentElement.dataset.mist=t}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/mist-ui.css">
<style>
  /* ===== 登录页布局 ===== */
  .login-wrap {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(420px, 560px) 1fr;
    align-items: center;
    gap: clamp(24px, 5vw, 80px);
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px clamp(20px, 4vw, 56px);
  }

  .login-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px clamp(20px, 4vw, 56px);
  }
  .login-top .hint { font-size: 13px; color: var(--ink-faint); }

  /* ---- 左：身份卡 ---- */
  .auth-col { display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 3; }
  .auth-head .kicker { margin-bottom: 10px; }
  .auth-head h1 { font-family: var(--font-round); font-weight: 800; font-size: 40px; line-height: 1.2; letter-spacing: .01em; }
  .auth-head p { margin-top: 10px; font-size: 15px; color: var(--ink-sub); line-height: 1.7; }

  .auth-card { padding: 26px 28px 24px; position: relative; }

  /* 模式切换：密码 / 验证码 */
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border-radius: var(--r-pill);
    background: var(--glass-soft);
    border: 1px solid var(--glass-border);
    margin-bottom: 20px;
  }
  .seg button {
    font-family: var(--font-round);
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink-sub);
    background: transparent;
    border: none;
    border-radius: var(--r-pill);
    padding: 9px 0;
    cursor: pointer;
    transition: color .2s, background-color .2s, box-shadow .2s;
  }
  .seg button.on {
    color: var(--ink);
    background: linear-gradient(135deg, var(--mist-strong), var(--mist-deep));
    box-shadow: var(--glow-mist), inset 0 1px 0 rgba(255,255,255,.4);
    text-shadow: 0 1px 2px rgba(20,40,80,.3);
  }
  html[data-mist='day'] .seg button.on { color: #fff; }

  .auth-form { display: flex; flex-direction: column; gap: 16px; }
  .mode { display: none; flex-direction: column; gap: 16px; }
  .mode.show { display: flex; animation: mode-in .3s var(--ease-moe); }
  @keyframes mode-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .form-err { min-height: 0; }
  .auth-submit { margin-top: 4px; width: 100%; font-size: 16px; padding: 13px; }

  .auth-links {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 13.5px;
  }
  .auth-links a { color: var(--mist-strong); text-decoration: none; cursor: pointer; font-weight: 600; }
  html[data-mist='day'] .auth-links a { color: var(--mist-deep); }
  .auth-links a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .or {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 14px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: .18em;
  }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
  .btn-google { width: 100%; }

  /* ---- 右：纱雾立绘 ---- */
  .sagiri-col { position: relative; height: min(78vh, 720px); z-index: 2; }
  .sagiri-col img.tachie {
    position: absolute;
    right: clamp(0px, 6vw, 70px);
    bottom: 0;
    height: 92%;
    filter: drop-shadow(0 18px 40px rgba(10, 16, 40, .45));
    animation: float-y 5s ease-in-out infinite;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* 月台 */
  .moon-pad {
    position: absolute;
    right: clamp(-10px, 3vw, 40px);
    bottom: -26px;
    width: 380px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(170,202,245,.4), rgba(170,202,245,.08) 62%, transparent 70%);
    filter: blur(2px);
  }
  /* 立绘旁浮动星饰 */
  .float-star {
    position: absolute;
    color: var(--star);
    font-size: 16px;
    animation: float-y 4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(246,201,87,.6));
  }

  /* 开场问候：对话盒 */
  .hero-say {
    position: absolute;
    top: 26px;
    right: clamp(0px, 8vw, 110px);
    width: min(320px, 80%);
    padding: 18px 22px 16px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-highlight);
  }
  .hero-say .plate {
    position: absolute;
    top: -14px; left: 16px;
    font-family: var(--font-round);
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    letter-spacing: .12em;
    padding: 4px 16px;
    border-radius: var(--r-pill);
    background: linear-gradient(135deg, var(--mist-strong), var(--mist-deep));
    box-shadow: var(--glow-mist), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .hero-say p { font-size: 15px; line-height: 1.75; color: var(--ink); min-height: 3.5em; }

  /* ---- 弹窗形态演示 ---- */
  .as-modal .sagiri-col, .as-modal .hero-say { display: none; }
  .as-modal .login-wrap { grid-template-columns: 1fr; justify-items: center; }
  .as-modal .auth-col { max-width: 460px; width: 100%; }
  .as-modal .auth-head { text-align: center; }
  .fake-app {
    display: none;
    position: fixed;
    inset: 0;
    z-index: -1;
    padding: 90px 60px;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
    filter: blur(3px) saturate(.9);
    opacity: .5;
  }
  .as-modal .fake-app { display: grid; }
  .fake-app .poster { aspect-ratio: 2/3; }

  .modal-switch {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 45;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--ink-sub);
    padding: 9px 16px;
    border-radius: var(--r-pill);
    cursor: pointer;
    user-select: none;
  }
  .modal-switch input { accent-color: var(--sakura); width: 15px; height: 15px; }

  /* 页面跳转 dock（审查用） */
  .page-dock {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 45;
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-radius: var(--r-pill);
  }
  .page-dock a {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-sub);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--r-pill);
    transition: color .15s, background-color .15s;
  }
  .page-dock a:hover { color: var(--ink); background: var(--glass-soft); }

  @media (max-width: 960px) {
    .login-wrap { grid-template-columns: 1fr; }
    .sagiri-col { display: none; }
  }
</style>
</head>
<body>
  <div class="mist-bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="mist-particles"></canvas>

  <div class="login-top">
    <a class="brand" href="index.html">
      <span class="star-mark">✦</span>MapleTools
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="hint">「雾境梦璃」设计稿 · 登录页</span>
      <button class="btn-ico" data-mist-toggle title="切换到晨雾"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </div>

  <main class="login-wrap">
    <!-- 左：身份卡 -->
    <div class="auth-col">
      <div class="auth-head">
        <span class="kicker"><span class="star-mark">✦</span>WELCOME HOME</span>
        <h1 class="title-dream">欢迎回到<br> MapleTools</h1>
        <p>番剧周历与追番管理的小站。登录后，纱雾会帮你把今天更新的番排好队。</p>
      </div>

      <div class="glass-strong auth-card" id="authCard">
        <!-- 登录模式内的两种方式 -->
        <div class="seg" id="loginSeg" data-tabs>
          <button class="on" data-tab="pwd" type="button">密码登录</button>
          <button data-tab="code" type="button">验证码登录</button>
        </div>

        <!-- 表单组 1：密码登录 -->
        <form class="auth-form mode show" data-panel="pwd" id="f-pwd" novalidate>
          <div class="field" style="position:relative">
            <label for="pwd-user">用户名</label>
            <div class="input-wrap">
              <span class="lead-ic"><svg class="ic"><use href="#i-user"/></svg></span>
              <input id="pwd-user" placeholder="你的用户名" autocomplete="username">
            </div>
            <span class="err-msg">请输入用户名</span>
          </div>
          <div class="field" style="position:relative">
            <label for="pwd-pass">密码</label>
            <div class="input-wrap">
              <span class="lead-ic"><svg class="ic"><use href="#i-key"/></svg></span>
              <input id="pwd-pass" type="password" placeholder="密码" autocomplete="current-password">
              <button class="tail-btn eye" type="button" title="显示/隐藏"><svg class="ic sm"><use href="#i-eye"/></svg></button>
            </div>
            <span class="err-msg">请输入密码</span>
          </div>
          <button class="btn btn-primary auth-submit" type="submit"><span class="star-mark">✦</span>进入小站</button>
        </form>

        <!-- 表单组 2：验证码登录 -->
        <form class="auth-form mode" data-panel="code" id="f-code" novalidate>
          <div class="field" style="position:relative">
            <label for="code-mail">邮箱</label>
            <div class="input-wrap with-tail">
              <span class="lead-ic"><svg class="ic"><use href="#i-mail"/></svg></span>
              <input id="code-mail" type="email" placeholder="you@example.com">
              <button class="tail-btn send" type="button">发送验证码</button>
            </div>
            <span class="err-msg">邮箱格式好像不太对</span>
          </div>
          <div class="field" style="position:relative">
            <label for="code-num">验证码</label>
            <div class="input-wrap" style="max-width:200px">
              <span class="lead-ic"><svg class="ic"><use href="#i-send"/></svg></span>
              <input id="code-num" placeholder="6 位数字" maxlength="6" inputmode="numeric">
            </div>
            <span class="err-msg">请输入验证码</span>
          </div>
          <button class="btn btn-primary auth-submit" type="submit"><span class="star-mark">✦</span>验证并进入</button>
        </form>

        <!-- 表单组 3：注册 -->
        <form class="auth-form mode" id="f-reg" novalidate style="display:none">
          <div class="field" style="position:relative">
            <label for="reg-user">用户名</label>
            <div class="input-wrap">
              <span class="lead-ic"><svg class="ic"><use href="#i-user"/></svg></span>
              <input id="reg-user" placeholder="给自己起个名字" maxlength="12">
            </div>
            <span class="err-msg">请输入用户名</span>
          </div>
          <div class="field" style="position:relative">
            <label for="reg-mail">邮箱</label>
            <div class="input-wrap with-tail">
              <span class="lead-ic"><svg class="ic"><use href="#i-mail"/></svg></span>
              <input id="reg-mail" type="email" placeholder="you@example.com">
              <button class="tail-btn send" type="button">发送验证码</button>
            </div>
            <span class="err-msg">邮箱格式好像不太对</span>
          </div>
          <div class="field" style="position:relative">
            <label for="reg-code">验证码</label>
            <div class="input-wrap" style="max-width:200px">
              <span class="lead-ic"><svg class="ic"><use href="#i-send"/></svg></span>
              <input id="reg-code" placeholder="6 位数字" maxlength="6" inputmode="numeric">
            </div>
            <span class="err-msg">请输入验证码</span>
          </div>
          <button class="btn btn-primary auth-submit" type="submit"><span class="star-mark">✦</span>创建账号</button>
        </form>

        <!-- 表单组 4：找回密码 -->
        <form class="auth-form mode" id="f-forgot" novalidate style="display:none">
          <div class="field" style="position:relative">
            <label for="fg-user">用户名</label>
            <div class="input-wrap">
              <span class="lead-ic"><svg class="ic"><use href="#i-user"/></svg></span>
              <input id="fg-user" placeholder="要找回的账号用户名">
            </div>
            <span class="err-msg">请输入用户名</span>
          </div>
          <div class="field" style="position:relative">
            <label for="fg-q">密保问题</label>
            <div class="dd" id="fg-dd">
              <button class="dd-btn" type="button"><span class="dd-val">选择你设置的密保问题</span><svg class="ic chev"><use href="#i-chev"/></svg></button>
              <div class="dd-menu">
                <button class="dd-item" type="button" data-val="最喜欢的动画作品">最喜欢的动画作品</button>
                <button class="dd-item" type="button" data-val="你的代表角色是">你的代表角色是</button>
                <button class="dd-item" type="button" data-val="第一只宠物的名字">第一只宠物的名字</button>
              </div>
            </div>
          </div>
          <div class="field" style="position:relative">
            <label for="fg-a">密保答案</label>
            <div class="input-wrap">
              <span class="lead-ic"><svg class="ic"><use href="#i-shield"/></svg></span>
              <input id="fg-a" placeholder="当年写下的答案">
            </div>
            <span class="err-msg">请输入密保答案</span>
          </div>
          <button class="btn btn-primary auth-submit" type="submit"><span class="star-mark">✦</span>找回密码</button>
        </form>

        <div class="auth-links">
          <a id="toReg">没有账号？注册一个</a>
          <a id="toForgot">忘记密码</a>
        </div>

        <div class="or">OR</div>
        <button class="btn btn-google" type="button" id="googleBtn"></button>
      </div>
    </div>

    <!-- 右：纱雾立绘 -->
    <div class="sagiri-col">
      <div class="hero-say">
        <span class="plate">纱雾</span>
        <p id="heroSay"></p>
      </div>
      <span class="float-star" style="top:12%;right:34%;animation-delay:-1s">✦</span>
      <span class="float-star" style="top:38%;right:6%;animation-delay:-2.2s;font-size:12px">✦</span>
      <span class="float-star" style="top:64%;right:52%;animation-delay:-3s;font-size:20px">✦</span>
      <div class="moon-pad"></div>
      <img class="tachie" src="assets/sagiri-full.png" alt="和泉纱雾立绘（官方素材）">
    </div>
  </main>

  <!-- 弹窗形态背后的假应用背景 -->
  <div class="fake-app" aria-hidden="true"></div>

  <label class="glass modal-switch">
    <input type="checkbox" id="modalSwitch">以应用内弹窗形态查看（紧凑卡，无立绘）
  </label>

  <nav class="glass page-dock">
    <a href="index.html">说明书</a><a href="calendar.html">周历</a><a href="tracks.html">追番</a><a href="settings.html">设置</a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    /* Google 品牌按钮内容 */
    document.getElementById('googleBtn').innerHTML = GOOGLE_MARK + '使用 Google 继续';

    /* 开场打字机问候 */
    (() => {
      const el = document.getElementById('heroSay');
      const line = '欢迎回来……账号填好了吗？填好我就把今天的番给你排出来。✦';
      let i = 0;
      setTimeout(function type() {
        el.textContent = line.slice(0, ++i);
        if (i < line.length) setTimeout(type, 45);
      }, 600);
    })();

    /* 模式切换：登录(seg) ⇄ 注册 ⇄ 找回 */
    const card = document.getElementById('authCard');
    const seg = document.getElementById('loginSeg');
    const modes = { pwd: 'f-pwd', code: 'f-code', reg: 'f-reg', forgot: 'f-forgot' };
    function showMode(m) {
      Object.values(modes).forEach((id) => {
        const f = document.getElementById(id);
        f.classList.toggle('show', id === modes[m]);
        f.style.display = f.classList.contains('show') ? 'flex' : 'none';
      });
      seg.style.display = (m === 'pwd' || m === 'code') ? 'grid' : 'none';
    }
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (b) showMode(b.dataset.tab);
    });
    document.getElementById('toReg').addEventListener('click', () => showMode('reg'));
    document.getElementById('toForgot').addEventListener('click', () => showMode('forgot'));
    card.addEventListener('click', (e) => {  // 弹窗形态下也保留 seg 切换
      if (e.target.closest('[data-tab]')) return;
    });

    /* 表单校验：错误抖动 + 绝对定位提示；成功走对话盒 */
    document.querySelectorAll('.auth-form').forEach((form) => {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let ok = true;
        form.querySelectorAll('.field').forEach((fd) => {
          const input = fd.querySelector('input');
          const valid = input ? input.value.trim().length > 0 : false;
          if (input && input.type === 'email') {
            const good = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(input.value);
            fd.classList.toggle('is-error', !good);
            if (!good) ok = false;
          } else if (!valid) {
            fd.classList.add('is-error');
            fd.classList.add('shake');
            setTimeout(() => fd.classList.remove('shake'), 450);
            ok = false;
          } else fd.classList.remove('is-error');
        });
        if (!ok) { Say.say('还有地方没填完哦，红色描边的就是。', { error: true }); return; }
        const which = form.id;
        if (which === 'f-reg') { Say.say('账号创建好了，欢迎加入～'); setTimeout(() => showMode('pwd'), 900); }
        else if (which === 'f-forgot') Say.say('密保答案核对通过，新密码已经发到你的邮箱。');
        else Say.say('欢迎回来，哥哥。今天也有更新中的番哦。');
      });
      form.querySelectorAll('input').forEach((i) =>
        i.addEventListener('input', () => i.closest('.field').classList.remove('is-error'))
      );
    });

    /* 密码可见切换 / 发送验证码倒计时 */
    document.querySelectorAll('.eye').forEach((b) => b.addEventListener('click', () => {
      const inp = b.closest('.input-wrap').querySelector('input');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = `<svg class="ic sm"><use href="#i-eye${show ? '-off' : ''}"/></svg>`;
    }));
    document.querySelectorAll('.send').forEach((b) => b.addEventListener('click', () => {
      const mail = b.closest('.input-wrap').querySelector('input');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value)) {
        const fd = b.closest('.field');
        fd.classList.add('is-error', 'shake');
        setTimeout(() => fd.classList.remove('shake'), 450);
        Say.say('先把邮箱填对我再发啦。', { error: true });
        return;
      }
      countdown(b, 60);
      Say.say('验证码已经发过去了，去看看邮箱吧。');
    }));
    document.getElementById('googleBtn').addEventListener('click', () =>
      Say.say('Google 登录会跳转到 Google 页面，这里是设计稿，就不真的跳了。')
    );

    /* 弹窗形态 */
    document.getElementById('modalSwitch').addEventListener('change', (e) => {
      document.body.classList.toggle('as-modal', e.target.checked);
      if (e.target.checked) Say.say('这是应用内弹窗的紧凑形态，立绘只在整页登录时出现。');
    });

    /* 假应用背景：几堵海报墙 */
    const grads = [
      'linear-gradient(160deg,#7ea8eb,#b7a3ec)', 'linear-gradient(160deg,#f4a8c4,#f6c957)',
      'linear-gradient(160deg,#8cd9b0,#7ea8eb)', 'linear-gradient(160deg,#b9a3ec,#f4a8c4)',
      'linear-gradient(160deg,#f6c957,#f58fa5)', 'linear-gradient(160deg,#7ea8eb,#8cd9b0)',
    ];
    document.querySelector('.fake-app').innerHTML = grads.map((g, i) =>
      `<div class="poster"><div class="ph" style="background:${g}"><span class="glyph">${'追番周历更新看'[i]}</span></div></div>`
    ).join('');
  </script>
</body>
</html>
