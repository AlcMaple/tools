<!DOCTYPE html>
<html lang="zh-CN" data-mist="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番剧周历 · MapleTools「雾境梦璃」设计稿</title>
<script>try{const t=localStorage.getItem('mist-theme');if(t)document.documentElement.dataset.mist=t}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/mist-ui.css">
<style>
  /* ===== 周历页 ===== */
  .nag {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px auto -6px;
    max-width: var(--page-w);
    padding: 10px 18px;
    font-size: 13.5px;
    color: var(--ink-sub);
    border-color: rgba(244,168,196,.4);
    border-radius: var(--r-md);
  }
  .nag .ic { color: var(--sakura); }
  .nag a { color: var(--sakura-strong); font-weight: 700; text-decoration: none; }
  html[data-mist='day'] .nag a { color: var(--sakura-deep); }
  .nag a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .nag .btn-ico { margin-left: auto; width: 28px; height: 28px; }

  .range-badge { font-family: var(--font-round); font-weight: 700; }

  /* 周墙 */
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 14px;
    align-items: start;
  }

  .day-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .day-head {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 8px;
    justify-content: center;
    padding: 10px 8px;
    border-radius: var(--r-md);
    background: var(--glass);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    transition: border-color .2s, transform .2s var(--ease-moe);
  }
  .day-col:hover .day-head { border-color: var(--glass-border-strong); transform: translateY(-2px); }
  .day-head .wd { font-family: var(--font-round); font-weight: 800; font-size: 16px; }
  .day-head .dt { font-family: var(--font-round); font-weight: 600; font-size: 12.5px; color: var(--ink-faint); }
  .day-col.today .day-head {
    border-color: rgba(244,168,196,.55);
    background: linear-gradient(160deg, rgba(244,168,196,.18), var(--glass));
    box-shadow: var(--glow-sakura), inset 0 1px 0 var(--glass-highlight);
  }
  .day-col.today .day-head .wd { color: var(--sakura-strong); }
  .day-col.pulse .day-head { animation: today-pulse 1s var(--ease-moe) 2; }
  @keyframes today-pulse {
    0%, 100% { box-shadow: var(--glow-sakura), inset 0 1px 0 var(--glass-highlight); }
    50% { box-shadow: 0 0 0 8px rgba(244,168,196,.14), var(--glow-sakura); }
  }
  .day-head .day-kanji { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-faint); font-weight: 700; }

  .day-col .poster + .poster { margin-top: 2px; }
  .poster .glyph { font-size: 74px; }
  .tracked-heart {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    color: #fff;
    background: rgba(244,168,196,.9);
    box-shadow: var(--glow-sakura);
  }

  .empty-day {
    display: grid;
    place-items: center;
    padding: 26px 8px;
    border-radius: var(--r-md);
    border: 1px dashed var(--glass-border);
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  /* 窄屏：日选模式 */
  .day-pills { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .day-pills button {
    font-family: var(--font-round);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-sub);
    padding: 8px 16px;
    border-radius: var(--r-pill);
    border: 1px solid var(--glass-border);
    background: var(--glass-soft);
    cursor: pointer;
    transition: all .18s var(--ease-moe);
  }
  .day-pills button:hover { transform: translateY(-2px); border-color: var(--glass-border-strong); }
  .day-pills button.on {
    color: #fff;
    background: linear-gradient(135deg, var(--mist-strong), var(--mist-deep));
    border-color: transparent;
    box-shadow: var(--glow-mist);
  }

  @media (max-width: 1100px) {
    .day-pills { display: flex; }
    .week { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .day-col { display: none; }
    .day-col.sel { display: flex; }
    .day-col .day-head { display: none; }
  }

  /* 图标自转（刷新反馈） */
  .spin .ic { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="mist-bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="mist-particles"></canvas>

  <header class="nav">
    <a class="brand" href="index.html"><span class="star-mark">✦</span>MapleTools</a>
    <nav class="nav-links">
      <a class="nav-link on" href="calendar.html"><svg class="ic sm"><use href="#i-calendar"/></svg>番剧周历</a>
      <a class="nav-link" href="tracks.html"><svg class="ic sm"><use href="#i-heart"/></svg>我的追番</a>
      <a class="nav-link" href="settings.html"><svg class="ic sm"><use href="#i-tune"/></svg>设置</a>
    </nav>
    <div class="nav-right">
      <button class="btn-ico" data-mist-toggle title="切换到晨雾"><svg class="ic"><use href="#i-moon"/></svg></button>
      <a class="btn btn-sakura btn-sm" href="login.html"><svg class="ic sm"><use href="#i-login"/></svg>登录</a>
    </div>
  </header>

  <main class="page">
    <!-- 安全提醒条（对应 NagBar） -->
    <div class="glass nag" id="nag">
      <svg class="ic"><use href="#i-shield"/></svg>
      账号还没有设置密保问题，找回密码会用得上
      <a href="settings.html">去设置 →</a>
      <button class="btn-ico" id="nagClose" title="关闭"><svg class="ic sm"><use href="#i-close"/></svg></button>
    </div>

    <div class="h-page" style="margin-top:26px">
      <span class="kicker"><span class="star-mark">✦</span>WEEKLY CALENDAR</span>
      <span class="badge range-badge">2026 夏 · 8/10 - 8/16</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" id="todayBtn"><svg class="ic sm"><use href="#i-calendar"/></svg>回到今天</button>
      <button class="btn btn-ghost btn-sm" id="refreshBtn"><svg class="ic sm"><use href="#i-refresh"/></svg>刷新</button>
    </div>
    <h1 style="font-family:var(--font-round);font-weight:800;font-size:30px;margin:-16px 0 22px">番剧周历</h1>

    <div class="day-pills" id="dayPills"></div>
    <div class="week" id="week"></div>
  </main>

  <nav class="glass page-dock" style="position:fixed;bottom:20px;right:20px;z-index:45;display:flex;gap:8px;padding:8px 10px;border-radius:999px">
    <a href="index.html" style="font-size:13px;font-weight:600;color:var(--ink-sub);text-decoration:none;padding:6px 12px;border-radius:999px">说明书</a>
    <a href="login.html" style="font-size:13px;font-weight:600;color:var(--ink-sub);text-decoration:none;padding:6px 12px;border-radius:999px">登录</a>
    <a href="tracks.html" style="font-size:13px;font-weight:600;color:var(--ink-sub);text-decoration:none;padding:6px 12px;border-radius:999px">追番</a>
    <a href="settings.html" style="font-size:13px;font-weight:600;color:var(--ink-sub);text-decoration:none;padding:6px 12px;border-radius:999px">设置</a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    /* ===== 假数据：2026 夏季周（今天=周日 8/16） ===== */
    const WEEK = [
      { wd: '周一', dt: '8/10', kanji: '月', shows: [
        { t: '药屋少女的呢喃 第2期', ep: 24, g: ['#7ea8eb', '#b7a3ec'], tracked: true },
        { t: '败犬女主太多了！ 第2期', ep: 9, g: ['#f4a8c4', '#f6c957'] },
      ]},
      { wd: '周二', dt: '8/11', kanji: '火', shows: [
        { t: '迷宫饭 第2期', ep: 20, g: ['#8cd9b0', '#7ea8eb'], tracked: true },
        { t: '时不时用俄语小声示好的邻座艾莉同学', ep: 31, g: ['#b9a3ec', '#f4a8c4'] },
      ]},
      { wd: '周三', dt: '8/12', kanji: '水', shows: [
        { t: '葬送的芙莉莲 第2期', ep: 16, g: ['#7ea8eb', '#8cd9b0'], tracked: true },
      ]},
      { wd: '周四', dt: '8/13', kanji: '木', shows: [
        { t: '我推的孩子 第3期', ep: 8, g: ['#f58fa5', '#b7a3ec'] },
        { t: '间谍过家家 PART.2', ep: 13, g: ['#f6c957', '#8cd9b0'] },
      ]},
      { wd: '周五', dt: '8/14', kanji: '金', shows: [
        { t: '物理魔法使马修 第2期', ep: 17, g: ['#8cd9b0', '#f6c957'] },
      ]},
      { wd: '周六', dt: '8/15', kanji: '土', shows: [
        { t: '关于我转生变成史莱姆这件事 第4期', ep: 7, g: ['#7ea8eb', '#f6c957'], tracked: true },
        { t: '无职转生 Ⅲ', ep: 9, g: ['#b9a3ec', '#7ea8eb'] },
      ]},
      { wd: '周日', dt: '8/16', kanji: '日', today: true, shows: [
        { t: '孤独摇滚！ 再放送', ep: 12, g: ['#f58fa5', '#f6c957'], tracked: true },
        { t: '摇曳露营△ 第4期', ep: 8, g: ['#8cd9b0', '#f4a8c4'] },
      ]},
    ];

    const weekEl = document.getElementById('week');
    const pillsEl = document.getElementById('dayPills');
    const todayIdx = WEEK.findIndex((d) => d.today);

    WEEK.forEach((d, i) => {
      const col = document.createElement('section');
      col.className = 'day-col' + (d.today ? ' today' : '');
      col.dataset.day = i;
      const posters = d.shows.length
        ? d.shows.map((s, j) => `
          <div class="poster">
            ${d.today ? '<span class="ribbon">今日更新</span>' : ''}
            ${s.tracked ? '<span class="tracked-heart" title="已在追番"><svg class="ic sm"><use href="#i-heart"/></svg></span>' : ''}
            <div class="ph" style="background:linear-gradient(160deg,${s.g[0]},${s.g[1]})">
              <span class="glyph">${s.t[0]}</span>
              <span class="mini-star" style="top:14%;left:16%">✦</span>
              <span class="mini-star" style="bottom:20%;right:14%;font-size:10px">✦</span>
            </div>
            <span class="badge b-star ep-flag">第 ${s.ep} 话</span>
            <div class="veil">
              <p class="v-title">${s.t}</p>
              <div class="v-acts">
                <button class="btn btn-sakura btn-sm track-btn" data-t="${s.t}">${s.tracked ? '已在追番' : '<svg class="ic sm"><use href="#i-plus"/></svg>追番'}</button>
                <button class="btn btn-ghost btn-sm bgm-btn" data-t="${s.t}" style="color:#fff;border-color:rgba(255,255,255,.4)">详情</button>
              </div>
            </div>
          </div>`).join('')
        : '<div class="empty-day">这天没有更新</div>';
      col.innerHTML = `
        <header class="day-head"><span class="day-kanji">${d.kanji}</span><span class="wd">${d.wd}</span><span class="dt">${d.dt}</span></header>
        ${posters}`;
      weekEl.appendChild(col);

      const pill = document.createElement('button');
      pill.textContent = `${d.wd} ${d.dt}`;
      pill.dataset.day = i;
      if (d.today) pill.classList.add('on');
      pillsEl.appendChild(pill);
    });

    /* 窄屏日选 */
    pillsEl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      pillsEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      document.querySelectorAll('.day-col').forEach((c) => c.classList.toggle('sel', c.dataset.day === b.dataset.day));
    });
    if (matchMedia('(max-width: 1100px)').matches) {
      document.querySelector(`.day-col[data-day='${todayIdx}']`).classList.add('sel');
    }

    /* 交互：追番 / 详情 / 回到今天 / 刷新 / NagBar */
    weekEl.addEventListener('click', (e) => {
      const track = e.target.closest('.track-btn');
      if (track) {
        const adding = !track.dataset.done;
        track.dataset.done = '1';
        track.innerHTML = '<svg class="ic sm"><use href="#i-check"/></svg>已在追番';
        Say.say(adding ? `《${track.dataset.t}》加进追番列表了。` : `《${track.dataset.t}》已经在列表里啦。`);
      }
      const bgm = e.target.closest('.bgm-btn');
      if (bgm) Say.say(`打开《${bgm.dataset.t}》的 Bangumi 条目页（设计稿内不跳转）。`);
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      const col = document.querySelector('.day-col.today');
      col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      col.classList.remove('pulse'); void col.offsetWidth; col.classList.add('pulse');
      document.querySelectorAll('.day-col').forEach((c) => c.classList.toggle('sel', c.classList.contains('today')));
      pillsEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.day == todayIdx));
    });
    document.getElementById('refreshBtn').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      btn.classList.add('spin');
      setTimeout(() => { btn.classList.remove('spin'); Say.say('周历已是最新，今天更新了两部。'); }, 1000);
    });
    document.getElementById('nagClose').addEventListener('click', () => document.getElementById('nag').remove());
  </script>
</body>
</html>
