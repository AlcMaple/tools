<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页版 · 接单评估</title>
<!-- 网页版接单评估设计稿。组件样式直接引用线上同一份 sketch-tokens / sketch-ui，
     页面私有样式写在下面 .oj-* 里，实现时搬进 web/src/styles/order-judge.css。
     外层（无 ?frame）是审稿台：设备 / 状态切换、待定事项、与桌面版的功能对照；
     ?frame=1&s=<状态> 才是界面本身，iframe 宽度决定走桌面还是手机断点（961px）。 -->
<link rel="stylesheet" href="../../../web/src/styles/sketch-tokens.css">
<link rel="stylesheet" href="../../../web/src/styles/sketch-ui.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, p, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  button { font: inherit; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--silver-line); border-radius: 2px; }

  .only-mob { display: none !important; }
  @media (max-width: 960px) {
    .only-desk { display: none !important; }
    .only-mob { display: revert !important; }
  }

  /* ---------- 页头 ---------- */
  .oj-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .oj-head .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .oj-tally { font-variant-numeric: tabular-nums; }
  .oj-tally b { font-weight: 600; }
  .oj-gear { position: relative; }
  /* 缺 Key / 档案时设置按钮带一个点：浮在角上，不改按钮尺寸 */
  .oj-gear.dot::after { content: ''; position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--sakura); border: 1.5px solid var(--card); }
  .seg .n { margin-left: 4px; font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }

  .oj-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 26px; align-items: start; margin-top: 22px; }
  @media (max-width: 960px) { .oj-grid { grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 16px; } }

  /* ---------- 材料区 ---------- */
  .oj-drop { position: relative; }
  .oj-text {
    display: block; width: 100%; min-height: 170px; resize: vertical;
    padding: 10px 12px; font: inherit; font-size: 14px; line-height: 28px; color: var(--ink);
    background: var(--field-bg) repeating-linear-gradient(transparent 0 24px, var(--grid-line) 24px 25px, transparent 25px 28px);
    background-position: 0 10px;
    background-attachment: local;
    border: 1.5px solid var(--field-line); border-radius: 10px 14px 10px 14px; outline: none;
  }
  .oj-text::placeholder { color: var(--ink-faint); }
  .oj-text:focus { border-color: var(--teal-line); box-shadow: 0 0 0 3px var(--teal-wash); }
  @media (max-width: 960px) { .oj-text { min-height: 132px; } }
  /* 拖入时整块盖一层，不改输入区尺寸 */
  .oj-over { position: absolute; inset: -6px; display: none; place-items: center; gap: 6px; z-index: 3;
    border: 2px dashed var(--teal-mid); border-radius: 12px; background: rgba(251, 246, 236, .9);
    color: var(--teal); font-family: var(--font-hand); font-size: 20px; }
  .oj-drop.drag .oj-over { display: grid; }

  .oj-files { display: flex; flex-wrap: wrap; gap: 12px 10px; margin-top: 14px; }
  .oj-file { position: relative; width: 88px; flex: none; }
  .oj-file .pic { position: relative; height: 64px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--paper-2); overflow: hidden;
    display: grid; place-items: center; color: var(--ink-faint); box-shadow: var(--shadow-1); }
  .oj-file:nth-child(3n+1) .pic { transform: rotate(-1.5deg); }
  .oj-file:nth-child(3n+2) .pic { transform: rotate(1deg); }
  .oj-file .pic.img { background: linear-gradient(160deg, #e8eef2 0 38%, #f6efe2 38% 62%, #e4dccb 62%); }
  .oj-file .pic.img.b { background: linear-gradient(200deg, #f1e6ea 0 30%, #eef3f4 30% 70%, #dfe7ea 70%); }
  .oj-file .pic.long { background: repeating-linear-gradient(180deg, #eef3f4 0 10px, #f6efe2 10px 20px); }
  .oj-file .pic .ic { width: 22px; height: 22px; }
  .oj-file .name { margin-top: 5px; font-size: 11px; color: var(--ink-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oj-file .note { position: absolute; left: 4px; bottom: 4px; width: max-content; padding: 0 5px; border-radius: 4px; background: rgba(62, 67, 80, .72); color: #fff; font-size: 10.5px; line-height: 17px; }
  .oj-file .rm { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--card); color: var(--ink-sub); cursor: pointer; z-index: 2; }
  .oj-file .rm .ic { width: 12px; height: 12px; }
  .oj-file.bad .pic { border: 1.5px dashed var(--gold); background: var(--gold-hl); color: var(--gold); }
  .oj-file.bad .name { color: var(--gold); }

  .oj-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .oj-bar .hint { font-size: 12.5px; color: var(--ink-faint); }
  .oj-bar .hint kbd { font: inherit; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); color: var(--ink-sub); }
  .oj-bar .go { margin-left: auto; position: relative; }
  /* 计时写在固定宽度的按钮里：秒数变化不推动旁边的按钮 */
  .oj-go { min-width: 128px; font-variant-numeric: tabular-nums; }
  .oj-tip { position: absolute; right: 0; top: calc(100% + 10px); width: max-content; max-width: 240px; z-index: 4; font-size: 12.5px; }
  .oj-tip.bubble::after { left: auto; right: 30px; bottom: auto; top: -7px; transform: rotate(225deg) skew(8deg, 8deg); }
  @media (max-width: 960px) {
    .oj-bar .go { margin-left: 0; width: 100%; }
    .oj-go { width: 100%; min-height: 46px; font-size: 15px; }
    .oj-tip { right: 50%; transform: translateX(50%); }
    .oj-tip.bubble::after { right: calc(50% - 6px); }
  }

  .oj-how { margin-top: 16px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
  .oj-how summary { display: flex; align-items: center; gap: 6px; min-height: 36px; cursor: pointer; font-size: 13px; color: var(--ink-sub); list-style: none; }
  .oj-how summary::-webkit-details-marker { display: none; }
  .oj-how summary .ic { transition: transform .2s; transform: rotate(-90deg); }
  .oj-how[open] summary .ic { transform: none; }
  .oj-how dl { display: grid; grid-template-columns: 92px 1fr; gap: 9px 12px; margin: 8px 0 2px; font-size: 12.5px; line-height: 1.65; }
  .oj-how dt { color: var(--ink); font-weight: 600; }
  .oj-how dd { margin: 0; color: var(--ink-sub); }
  @media (max-width: 960px) { .oj-how dl { grid-template-columns: 1fr; gap: 2px; } .oj-how dd { margin-bottom: 8px; } }

  /* ---------- 批改单（结论） ---------- */
  .oj-sheet { padding: 22px 22px 20px; min-height: 340px; }
  .oj-sheet.blank { display: grid; place-items: center; text-align: center; }
  .oj-meta { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; padding-right: 92px; }
  .oj-verdict { position: absolute; top: 16px; right: 18px; width: 78px; height: 78px; font-size: 19px; border-width: 2.5px; letter-spacing: .06em; }
  .oj-verdict::before { inset: 4px; }
  @media (max-width: 960px) {
    .oj-sheet { padding: 20px 16px 18px; }
    .oj-verdict { width: 64px; height: 64px; font-size: 16px; top: 14px; right: 12px; }
    .oj-meta, .oj-headline { padding-right: 72px; }
    .oj-headline { font-size: 18px; }
  }
  .oj-headline { margin-top: 8px; padding-right: 92px; font-family: var(--font-hand); font-size: 20px; line-height: 1.5; color: var(--ink); }
  .oj-summary { margin-top: 10px; font-size: 13.5px; line-height: 1.75; color: var(--ink-sub); }
  .oj-sec { margin-top: 18px; padding-top: 14px; border-top: 1.5px dashed var(--line); }
  .oj-sec h3 { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 10px; letter-spacing: .04em; }
  .oj-sec h3 .ic { color: var(--teal); }
  .oj-list { display: grid; gap: 10px; counter-reset: n; }
  .oj-list li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13.5px; line-height: 1.7; counter-increment: n; }
  .oj-list li::before { content: counter(n); font-family: var(--font-hand); color: var(--teal); font-size: 15px; line-height: 1.55; }
  .oj-list.warn li::before { color: var(--gold); }
  .oj-list b { color: var(--ink); font-weight: 600; }
  .oj-list span { color: var(--ink-sub); }
  .oj-risk { margin-top: 14px; padding: 10px 14px; border: 1.5px dashed var(--sakura); border-radius: 8px; background: var(--sakura-wash); font-size: 13.5px; line-height: 1.7; color: var(--ink); display: flex; gap: 8px; }
  .oj-risk .ic { color: var(--sakura); margin-top: 3px; }
  .oj-q li { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; line-height: 1.7; padding: 3px 0; }
  .oj-q li::before { content: ''; flex: none; width: 13px; height: 13px; border: 1.5px solid var(--line-strong); border-radius: 3px; transform: translateY(2px) rotate(-3deg); }
  .oj-flip { flex: none; padding: 0 7px; border-radius: 999px; background: var(--gold-hl); color: var(--ink); font-size: 11px; line-height: 19px; white-space: nowrap; }
  .oj-acts { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  .oj-steps { display: grid; gap: 14px; margin-top: 22px; }
  .oj-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; }
  .oj-steps .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: #fff; }
  .oj-steps .mk .ic { width: 13px; height: 13px; stroke-width: 2.6; }
  .oj-steps .done .mk { background: var(--teal-mid); border-color: var(--teal); }
  .oj-steps .run .mk { border: 2px solid var(--teal-wash); border-top-color: var(--teal-mid); animation: oj-spin .9s linear infinite; }
  .oj-steps .wait { color: var(--ink-faint); }
  .oj-steps small { display: block; font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  @keyframes oj-spin { to { transform: rotate(360deg); } }

  .oj-err { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--paper-2); font-size: 13px; line-height: 1.7; color: var(--ink-sub); }
  .oj-err code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); }

  /* ---------- 平板 / 手机：编辑 → 评估中 → 结论 三段流程 ---------- */
  .oj-brief, .oj-flowbar { display: none; }
  .oj-brief .ex { font-size: 13px; line-height: 1.65; color: var(--ink-sub); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .oj-brief .strip { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .oj-brief .strip span { flex: none; width: 46px; height: 36px; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center; color: var(--ink-faint); }
  .oj-brief .strip span .ic { width: 15px; height: 15px; }
  .oj-brief summary { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; list-style: none; font-size: 13.5px; }
  .oj-brief summary::-webkit-details-marker { display: none; }
  .oj-brief summary .meta { margin-left: auto; font-size: 12px; color: var(--ink-faint); }
  .oj-brief summary .ic { color: var(--teal); }
  .oj-flowbar { align-items: center; justify-content: space-between; gap: 10px; }
  .oj-cancel { margin-top: 20px; }
  @media (max-width: 960px) {
    .oj-grid:not(.flow) > .oj-blank { display: none; }
    .oj-grid.flow > .oj-mat { display: none; }
    .oj-grid.flow .oj-brief { display: block; }
    .oj-grid.flow .oj-flowbar { display: flex; }
    .oj-grid.flow { gap: 14px; }
    .oj-cancel .btn { width: 100%; min-height: 44px; }
    .oj-brief.panel { padding: 14px 16px; }
  }

  /* ---------- 历史 ---------- */
  .oj-hist { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 26px; align-items: start; margin-top: 22px; }
  @media (max-width: 960px) { .oj-hist { grid-template-columns: minmax(0, 1fr); margin-top: 16px; } }
  .oj-rows { padding: 6px; }
  .oj-row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 9px 44px 9px 10px; text-align: left;
    background: none; border: 1.5px solid transparent; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .oj-row + .oj-row { border-top: 1px dashed var(--line); border-radius: 0; }
  .oj-row.on { background: var(--teal-wash); border-radius: 8px; }
  .oj-row .t { min-width: 0; flex: 1; }
  .oj-row .t b { display: block; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oj-row .t span { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .oj-row .del { position: absolute; right: 6px; top: 50%; margin-top: -16px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0;
    border: none; border-radius: 50%; background: none; color: var(--ink-faint); cursor: pointer; opacity: 0; }
  .oj-row:hover .del, .oj-row.on .del { opacity: 1; }
  @media (hover: none) { .oj-row .del { opacity: 1; } }
  .oj-row .stamp { font-size: 10.5px; }
  .oj-back { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0; border: none; background: none; color: var(--teal); cursor: pointer; font-size: 14px; }

  /* ---------- 设置（桌面弹窗 / 手机底部抽屉） ---------- */
  .oj-set .field + .field { margin-top: 18px; }
  .oj-doc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px dashed var(--field-line); border-radius: 10px 14px 10px 14px; background: var(--field-bg); }
  .oj-doc .ic { color: var(--teal); }
  .oj-doc .t { flex: 1; min-width: 0; }
  .oj-doc .t b { display: block; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oj-doc .t span { font-size: 11.5px; color: var(--ink-faint); }
  .oj-doc.empty-doc { color: var(--ink-faint); font-size: 13px; }
  .oj-set-foot { position: relative; display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 22px; }
  .oj-saved { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--teal); }
  .oj-bsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; max-height: 86svh; overflow-y: auto; padding: 10px 18px 26px;
    background: var(--card); border-top: 1.5px solid var(--line-strong); border-radius: 18px 22px 0 0; box-shadow: var(--shadow-2); }
  .oj-bsheet .grip { width: 44px; height: 4px; margin: 0 auto 12px; border-radius: 2px; background: var(--silver-line); }

  /* 未登录 */
  .oj-guest { max-width: 460px; margin: 40px auto 0; text-align: center; padding: 30px 26px 26px; }
  .oj-guest img { width: 96px; height: 96px; border-radius: 50%; border: 1.5px solid var(--silver-line); }

  /* ================= 审稿台（外层） ================= */
  .rv { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 30px 20px 80px; }
  .rv-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .rv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .rv-chip { min-height: 32px; padding: 4px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); font-size: 12.5px; color: var(--ink-sub); cursor: pointer; }
  .rv-chip.on { border-color: var(--teal); color: var(--teal); background: var(--teal-wash); font-weight: 600; }
  .rv-cap { margin-top: 12px; font-size: 13px; color: var(--ink-sub); line-height: 1.7; min-height: 44px; }
  .rv-stage { margin-top: 10px; display: flex; justify-content: center; }
  .rv-frame { border: 1.5px solid var(--line-strong); border-radius: 12px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow-2); }
  .rv-frame iframe { display: block; border: 0; transform-origin: 0 0; }
  .rv h2 { font-family: var(--font-hand); font-size: 22px; font-weight: 400; margin: 44px 0 14px; }
  .rv-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.65; background: var(--card); border: 1.5px solid var(--line); }
  .rv-table th, .rv-table td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px dashed var(--line); }
  .rv-table th { font-weight: 600; color: var(--ink); background: var(--paper-2); }
  .rv-table td:first-child { color: var(--ink-faint); width: 34px; font-variant-numeric: tabular-nums; }
  .rv-table .go { color: var(--teal); cursor: pointer; white-space: nowrap; }
  .rv-q { display: grid; gap: 14px; }
  .rv-q .panel p { font-size: 13.5px; line-height: 1.75; color: var(--ink-sub); }
  .rv-q .panel p + p { margin-top: 6px; }
  .rv-q .panel b { color: var(--ink); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-tracks" viewBox="0 0 24 24"><rect x="6" y="8.5" width="14" height="11.5" rx="2"/><path d="M4 15.5V6a2 2 0 0 1 2-2h9.5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6.5h8M17.5 6.5H20M4 12h3M12.5 12H20M4 17.5h10M19 17.5h1"/><circle cx="14.5" cy="6.5" r="2.2"/><circle cx="9.5" cy="12" r="2.2"/><circle cx="16.5" cy="17.5" r="2.2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M5 20c1.2-3.6 4-5.3 7-5.3s5.8 1.7 7 5.3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5L21 19.5H3z"/><path d="M12 10.2v3.6M12 16.4v.2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v4.3h-4.3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9.5 8l-4 4 4 4M5 12h9.5"/><path d="M13 4.5h5.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H13"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M16.5 11.5l-6.9 6.9a3.4 3.4 0 0 1-4.8-4.8l8.2-8.2a2.3 2.3 0 0 1 3.2 3.2l-8.2 8.2a1.1 1.1 0 0 1-1.6-1.6l7.2-7.2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20.5h8.5"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7.2 18.8 3 20l1.2-4.2z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <!-- 新增：接单评估入口 / 文档 / 视频 / 粘贴 / 删除 -->
  <symbol id="i-judge" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9.2 3.5h5.6v2.8H9.2z"/><path d="M8.8 13.2l2.3 2.3 4.2-4.6"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></symbol>

  yes: { label: '结论 · 能接', cap: '平板 / 手机：结论单独一屏，顶部「返回修改」回到编辑（材料保留）、「再评一单」清空重来，这单的材料折叠在结论下面。结论做成一张「批改单」：右上角盖章（能接 / 不接 / 待补），一句话结论用手写体。顺序沿用桌面版：需求 → 风险 → 为什么 → 可能翻车的地方 → 接单前先问清楚。' },
  no: { label: '结论 · 不接', cap: '有风险时，粉色虚线框放在理由前面。「能接」时这一块叫「可能翻车的地方」，「不接」时叫「卡在哪一步」。' },
  info: { label: '结论 · 信息不足', cap: '本地预检直接判出来的（空内容、只有「[聊天记录]」），不调用 AI、不花钱，只告诉用户怎么补。' },
  'e-key': { label: '出错 · Key 无效', cap: '按真实原因分开显示，错误码原样附在下面。HTTP 错误一律不自动重试，出错的这次不进历史（界面上不写这些）。' },
  'e-balance': { label: '出错 · 余额不足', cap: '402 单独一句话，不跟 Key 无效混在一起。' },
  'e-limit': { label: '出错 · 本站限流', cap: '本站每人每分钟的评估次数上限，写明还要等几秒，避免用户以为是 DeepSeek 坏了而反复点。' },
  hist: { label: '历史', cap: '历史是单独一个视图：桌面左边列表、右边批改单；手机先看列表，点进去看单条（下一张）。每条可删，可「放回材料区重新评估」。最多留 50 条。' },
  hdetail: { label: '历史 · 手机单条', cap: '手机点进一条历史：顶部「返回历史」，下面就是同一张批改单。' },
  settings: { label: '评估设置', cap: '桌面是弹窗，手机是底部抽屉。档案和日志上传 .md，保存在你的账号下，换设备也在；保存提示浮在按钮左边。' },
  guest: { label: '未登录', cap: '入口对所有人可见；没登录时只显示一张卡片，登录后才能用（档案、日志、历史都跟账号走）。' },
};

function brief(text, files, { fold = false } = {}) {
  const strip = files.length ? `<div class="strip">${files.map((f) => `<span>${ic(f.k === 'video' ? 'video' : f.k === 'doc' ? 'doc' : 'clip')}</span>`).join('')}</div>` : '';
  const meta = `${files.length} 个附件`;
  if (fold) {
    return `<details class="panel oj-brief"><summary>${ic('clip')}这单的材料<span class="meta">${meta}</span>${ic('chev', 'ic ic-sm')}</summary>
      <p class="ex">${esc(text)}</p>${strip}</details>`;
  }
  return `<section class="panel oj-brief"><span class="tape tl teal"></span>
    <div class="panel-title" style="margin-bottom:8px">${ic('clip')}这单的材料<span class="faint small" style="margin-left:auto">${meta}</span></div>
    <p class="ex">${esc(text)}</p>${strip}</section>`;
}
const flowbar = () => `<div class="oj-flowbar"><button type="button" class="oj-back">${ic('back')}返回修改</button><button type="button" class="btn btn-sm">再评一单</button></div>`;

function pageFor(s) {
  if (s === 'guest') {
    return `${head()}<section class="panel oj-guest"><span class="tape tl teal"></span>
      <img src="${AVATAR}" alt="">
      <p class="font-hand" style="font-size:20px;margin-top:14px">登录后就能评估派单</p>
      <p class="muted small mt8">能力档案、项目日志和评估记录都跟着账号走。</p>
      <button type="button" class="btn btn-primary mt24" style="min-width:160px">登录 / 注册</button></section>`;
  }
  if (s === 'hist' || s === 'hdetail') {
    if (s === 'hdetail') return `${head({ tab: 'hist' })}<div class="oj-hist"><button type="button" class="oj-back">${ic('back')}返回历史</button>${reportSheet('yes', { fromHist: true })}</div>`;
    return `${head({ tab: 'hist' })}<div class="oj-hist">${histList(0)}<div class="only-desk">${reportSheet('yes', { fromHist: true })}</div></div>`;
  }
  const nag = s === 'empty' ? `<div class="nag mt16">${ic('alert')}还没有填 DeepSeek Key 和能力档案，评估前要先填好<button type="button" class="btn btn-sm">去填写</button></div>` : '';
  const m = {
    empty: [materials(), blankSheet()],
    nofill: [materials({ tip: '还没有放入内容' }), blankSheet()],
    drag: [materials({ text: TEXT, files: FILES.slice(0, 2), drag: true }), blankSheet()],
    filled: [materials({ text: TEXT, files: [...FILES, BAD] }), blankSheet()],
    running: [materials({ text: TEXT, files: FILES, running: true, sec: 17 }), runningSheet()],
    yes: [materials({ text: TEXT, files: FILES }), reportSheet('yes')],
    no: [materials({ text: '【派单】iOS 越狱插件，去广告 + 解锁会员，适配 iOS 17，预算 800', files: FILES.slice(0, 1) }), reportSheet('no')],
    info: [materials({ text: '[聊天记录]' }), reportSheet('info')],
    'e-key': [materials({ text: TEXT, files: FILES }), errorSheet('key')],
    'e-balance': [materials({ text: TEXT, files: FILES }), errorSheet('balance')],
    'e-limit': [materials({ text: TEXT, files: FILES }), errorSheet('limit')],
    settings: [materials({ text: TEXT, files: FILES }), reportSheet('yes')],
  }[s] || [materials(), blankSheet()];
  // 平板 / 手机：评估中只看材料摘要 + 进度；出结论后结论在上、材料折叠在下。桌面仍是左右两栏
  const flowText = s === 'no' ? '【派单】iOS 越狱插件，去广告 + 解锁会员，适配 iOS 17，预算 800' : s === 'info' ? '[聊天记录]' : TEXT;
  const flowFiles = s === 'no' ? FILES.slice(0, 1) : s === 'info' ? [] : FILES;
  if (s === 'running') return `${head()}<div class="oj-grid flow">${m[0]}${brief(flowText, flowFiles)}${m[1]}</div>`;
  if (['yes', 'no', 'info', 'e-key', 'e-balance', 'e-limit'].includes(s)) {
    return `${head()}<div class="oj-grid flow">${m[0]}<div style="display:grid;gap:14px;min-width:0">${flowbar()}${m[1]}${brief(flowText, flowFiles, { fold: true })}</div></div>`;
  }
  return `${head({ gearDot: s === 'empty' })}${nag}<div class="oj-grid">${m[0]}${m[1]}</div>`;
}

function renderFrame() {
  document.body.dataset.page = 'order-judge';
  let html = shell(pageFor(S), S === 'guest');
  if (S === 'settings') {
    html += `<div class="dlg-backdrop open only-desk" style="display:flex"><div class="dlg" role="dialog" aria-label="评估设置">
      <button type="button" class="dlg-close" aria-label="关闭">${ic('x')}</button>
      <p class="font-hand" style="font-size:20px;margin-bottom:18px">评估设置</p>${settingsBody()}</div></div>
      <div class="only-mob"><div class="dlg-backdrop open" style="display:block"></div>
      <div class="oj-bsheet" role="dialog" aria-label="评估设置"><div class="grip"></div>
      <p class="font-hand" style="font-size:19px;margin-bottom:16px">评估设置</p>${settingsBody()}</div></div>`;
  }
  $('#app').innerHTML = html;
}

// ───────────────────────── 审稿台 ─────────────────────────
const ALIGN = [
  ['粘贴文字，可多次；焦点不在输入框也能粘进去', '桌面同左（整页监听 paste）；手机用「粘贴」按钮读剪贴板', 'filled'],
  ['粘贴截图（多张，自动命名 截图01…）', '同左；图片在浏览器里缩到长边 2000px 再上传', 'filled'],
  ['拖入文件 / 选择文件', '桌面拖入覆盖层 +「选择文件」；手机「添加文件」，可选相册和文件', 'drag'],
  ['文件 chip：缩略图、文件名、单个移除', '同左，角标写长图切几块、视频几帧、PDF 几页', 'filled'],
  ['快捷键按平台显示', '桌面按系统显示 ⌘V / Ctrl+V；手机不显示快捷键', 'filled'],
  ['「不同材料怎么放」折叠说明', '六项保留；空态默认展开，有材料后收起', 'empty'],
  ['评估 / 清空按钮', '桌面在材料区底栏右侧；手机评估按钮通栏', 'filled'],
  ['空内容提示「还没有放入内容」', '浮在按钮下方的气泡，不插进流', 'nofill'],
  ['「分析中，已用 N 秒」', '秒数在固定宽度的按钮里 + 右栏三步进度', 'running'],
  ['视频抽 12 帧', '浏览器里用 <video> 取帧，只上传 12 张 JPEG；浏览器解码不了的格式标黄跳过', 'filled'],
  ['长图切块、PDF / Word / 网址 / 腾讯文档', '长图、PDF、Word 在浏览器处理；网址由服务端抓取（同站间隔 3～5 秒）', 'running'],
  ['结论徽章 + 一句话（能 / 不能 / 信息不足 / 出错）', '改成盖章：能接 / 不接 / 待补；出错不盖章', 'yes'],
  ['需求 / 风险 / 原因 / 卡点 / 先问清楚', '顺序与命名不变，「可能改判」是小标签', 'yes'],
  ['空内容或「[聊天记录]」直接判信息不足', '同左，本地预检、不调用 AI，附「怎么补」', 'info'],
  ['出错原因分开', 'Key 无效 / 余额不足 / DeepSeek 限流 / 本站限流 / 网络 / 空返回，错误码原样附上', 'e-key'],
  ['历史记录 + 展开看完整报告', '单独的「历史」视图，列表 + 批改单；可放回材料区重新评估', 'hist'],
  ['历史为空', '「还没有评估过的派单」', 'hist'],
  ['旧 Python 历史迁移', '不迁移', ''],
  ['删除历史', '每条右侧删除按钮（触屏常显）', 'hist'],
  ['Key 设置', '页头设置按钮 → 弹窗 / 底部抽屉；缺 Key 时角上红点 + 顶部提示条', 'settings'],
  ['能力档案 / 项目日志', '上传 .md，存在账号下，跨设备可用；「更换」覆盖上传', 'settings'],
  ['深色模式', '网页版只有素纸一套主题，不做', ''],
  ['窄屏适配', '≤960px 单列：材料在上、结论在下；模式切换改下拉；设置走底部抽屉', 'yes'],
];

function renderReview() {
  document.title = '网页版 · 接单评估 · 设计稿';
  const keys = Object.keys(STATES);
  $('#app').innerHTML = `<div class="rv">
    <h1 class="title-sketch" style="font-size:32px">网页版 · 接单评估</h1>
    <p class="muted small mt16">组件直接引用线上的 sketch-ui.css；切换设备看 961px 断点两侧的样子。</p>
    <div class="rv-bar">
      <div class="seg" id="dev"><button type="button" data-d="desk" class="on">桌面 1280</button><button type="button" data-d="mob">手机 390</button></div>
    </div>
    <div class="rv-chips" id="chips">${keys.map((k) => `<button type="button" class="rv-chip" data-s="${k}">${STATES[k].label}</button>`).join('')}</div>
    <p class="rv-cap" id="cap"></p>
    <div class="rv-stage"><div class="rv-frame" id="fw"><iframe id="fr" title="界面预览"></iframe></div></div>

    <h2>需要你定的两件事</h2>
    <div class="rv-q">
      <div class="panel"><span class="tape tl gold"></span>
        <p><b>1. DeepSeek Key 存在哪？</b></p>
        <p><b>A（推荐）只存在这台设备的浏览器里</b>，每次评估随请求发给我们的服务器，服务器用完就丢，不写库也不打日志。和网站现有的「用你自己的 AI」是同一个做法。代价是换手机 / 换电脑要再填一次。</p>
        <p><b>B 服务器加密保存</b>，换设备不用再填。代价是数据库和服务器密钥同时泄露时，Key 会一起泄露。</p>
        <p>两种都只走服务器调用 DeepSeek：浏览器拿不到 DeepSeek 的原始返回，也就没有可以转发的调用流；评估接口要登录 + 同源校验 + 每人每分钟限次。</p>
      </div>
      <div class="panel"><span class="tape tl gold"></span>
        <p><b>2. 历史里要不要留当时的图片？</b></p>
        <p><b>A（推荐）留压缩后的图</b>（每张约 150 KB，最多 50 条），「放回材料区重新评估」时图也能一起回来，和桌面版一致。</p>
        <p><b>B 只留文字和结论</b>，省服务器空间；放回材料区时只有文字。</p>
      </div>
    </div>

    <h2>与桌面版的功能对照（23 项）</h2>
    <table class="rv-table"><thead><tr><th>#</th><th>桌面版</th><th>网页版</th><th>看哪一屏</th></tr></thead>
      <tbody>${ALIGN.map(([a, b, s], i) => `<tr><td>${i + 1}</td><td>${a}</td><td>${esc(b)}</td><td>${s ? `<span class="go" data-s="${s}">${STATES[s].label}</span>` : '—'}</td></tr>`).join('')}</tbody></table>
  </div>`;

  let dev = 'desk', st = 'yes';
  const fr = $('#fr'), fw = $('#fw');
  function fit() {
    const w = dev === 'desk' ? 1280 : 390, h = dev === 'desk' ? 860 : 844;
    const avail = Math.min(fw.parentElement.clientWidth, 1140);
    const k = dev === 'desk' ? Math.min(1, avail / w) : 1;
    fr.style.width = w + 'px'; fr.style.height = h + 'px'; fr.style.transform = `scale(${k})`;
    fw.style.width = w * k + 'px'; fw.style.height = h * k + 'px';
  }
  function go() {
    fr.src = `?frame=1&s=${st}`;
    document.querySelectorAll('#chips .rv-chip').forEach((b) => b.classList.toggle('on', b.dataset.s === st));
    document.querySelectorAll('#dev button').forEach((b) => b.classList.toggle('on', b.dataset.d === dev));
    $('#cap').textContent = STATES[st].cap;
    fit();
  }
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-s]'); if (c) { st = c.dataset.s; if (st === 'hdetail') dev = 'mob'; go(); if (c.classList.contains('go')) scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const d = e.target.closest('[data-d]'); if (d) { dev = d.dataset.d; go(); }
  });
  addEventListener('resize', fit);
  go();
}

FRAME ? renderFrame() : renderReview();
</script>
